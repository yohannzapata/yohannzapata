<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <style>
      .mono {
        font-family: 'Courier New', 'Consolas', 'DejaVu Sans Mono', monospace;
      }
      .ascii {
        font-size: 11.5px;
        fill: #abb2bf;
      }
      .info {
        font-size: 13px;
      }
      .k { fill: #d19a66; font-weight: bold; } /* Keys (Orange/Amber) */
      .v { fill: #61afef; font-weight: bold; } /* Values (Soft Blue) */
      .t { fill: #4b5263; }                   /* Dots / Lines (Muted Gray) */
      .g { fill: #98c379; font-weight: bold; } /* Green additions */
      .r { fill: #e06c75; font-weight: bold; } /* Red deletions */
      .h { fill: #abb2bf; font-weight: bold; } /* Section headers / username */
