<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <style>
      .mono {
        font-family: 'Courier New', 'Consolas', 'DejaVu Sans Mono', monospace;
      }
      .ascii {
        font-size: 11.5px;
        fill: #080c14;              /* Deep obsidian for high contrast */
        font-weight: bold;          /* Gives thin symbols (, . : -) visual weight */
        stroke: #080c14;            /* Micro stroke to thicken character lines */
        stroke-width: 0.25px;
      }
      .info {
        font-size: 13px;
      }
      .k { fill: #b83219; font-weight: bold; } /* Keys */
      .v { fill: #0a3d7a; font-weight: bold; } /* Values */
      .t { fill: #1d2129; }                   /* Dots / Lines */
      .g { fill: #237834; font-weight: bold; } /* Green additions */
      .r { fill: #b83219; font-weight: bold; } /* Red deletions */
      .h { fill: #1d2129; font-weight: bold; } /* Section headers */
    </style>
  </defs>

